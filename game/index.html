<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALDERA BAY</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; font-family: sans-serif; color: #fff; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 1; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
  #hud-notify { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(180, 40, 40, 0.9); padding: 14px 28px; border-radius: 8px; font-size: 22px; font-weight: bold; letter-spacing: 1px; display: none; z-index: 25; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  #title-overlay { position: fixed; inset: 0; background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity 0.5s ease; }
  #title-overlay h1 { font-size: 56px; letter-spacing: 6px; margin: 0 0 10px 0; color: #ffaa44; text-shadow: 0 4px 30px rgba(255,170,68,0.4); }
  #title-overlay p { font-size: 18px; color: #a0aec0; margin: 0 0 30px 0; font-weight: bold; }
  #title-overlay button { background: #ffaa44; color: #0d1b2a; border: none; padding: 16px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s, transform 0.2s; box-shadow: 0 4px 20px rgba(255,170,68,0.3); }
  #title-overlay button:hover { background: #ffbb66; transform: scale(1.05); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "./three.module.min.js"
    }
  }
</script>
</head>
<body>
<canvas id="game" aria-label="Caldera Bay: Open-world crime game"></canvas>
<div id="hud"></div>
<div id="hud-notify"></div>
<div id="title-overlay">
  <h1>CALDERA BAY</h1>
  <p>8 JOBS · 5 DISTRICTS · ONE CITY TO TAKE</p>
  <button id="start-btn">PLAY GAME</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./main.js"></script>
</body>
</html>
