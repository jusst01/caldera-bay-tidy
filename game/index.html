<!DOCTYPE html>
<html>
<head>
  <title>Caldera Bay</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #game { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #hud, #hud-notify, #hud-root, #screen-root, #start-btn, #status, #title-overlay {
      position: absolute; z-index: 2; pointer-events: none;
    }
    #start-btn { pointer-events: auto; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="hud"></div>
  <div id="hud-notify"></div>
  <div id="hud-root"></div>
  <div id="screen-root"></div>
  <div id="start-btn"></div>
  <div id="status"></div>
  <div id="title-overlay"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
