<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALDERA BAY</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; font-family: sans-serif; color: #fff; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 1; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
  .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .hud-stats { background: rgba(10, 15, 25, 0.75); padding: 12px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(4px); font-size: 15px; font-weight: bold; letter-spacing: 0.5px; }
  .hud-stats div { margin-bottom: 4px; }
  .hud-stats div:last-child { margin-bottom: 0; }
  .hud-district { background: rgba(10, 15, 25, 0.75); padding: 10px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); font-size: 14px; text-align: right; }
  .hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  #hud-prompt { background: rgba(20, 30, 45, 0.85); padding: 10px 20px; border-radius: 6px; border: 1px solid #ffaa44; font-size: 16px; font-weight: bold; color: #ffcc66; display: none; pointer-events: auto; cursor: pointer; }
  #hud-notify { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(180, 40, 40, 0.9); padding: 14px 28px; border-radius: 8px; font-size: 22px; font-weight: bold; letter-spacing: 1px; display: none; z-index: 20; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  #hud-dialogue { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 600px; max-width: 90vw; background: rgba(15, 20, 30, 0.92); border: 1px solid rgba(255,255,255,0.2); padding: 16px 22px; border-radius: 8px; display: none; z-index: 20; }
  #hud-dialogue .speaker { font-size: 13px; color: #ffaa44; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  #hud-dialogue .text { font-size: 16px; color: #eee; line-height: 1.4; }
  #title-overlay { position: fixed; inset: 0; background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity 0.5s ease; }
  #title-overlay h1 { font-size: 48px; letter-spacing: 4px; margin: 0 0 10px 0; color: #ffaa44; text-shadow: 0 4px 20px rgba(255,170,68,0.4); }
  #title-overlay p { font-size: 18px; color: #a0aec0; margin: 0 0 30px 0; }
  #title-overlay button { background: #ffaa44; color: #0d1b2a; border: none; padding: 14px 36px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s, transform 0.2s; box-shadow: 0 4px 15px rgba(255,170,68,0.3); }
  #title-overlay button:hover { background: #ffbb66; transform: scale(1.05); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "./three.module.min.js"
    }
  }
</script>
</head>
<body>
<canvas id="game" aria-label="Caldera Bay: Open-world crime game"></canvas>
<div id="hud">
  <div class="hud-bottom">
    <div id="hud-prompt">Press E to interact</div>
    <div id="hud-weapon-wheel" style="display: none; position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(10,15,25,0.9); border: 1px solid rgba(255,170,68,0.5); border-radius: 8px; padding: 10px 20px; font-size: 14px; text-align: center;">
      <div style="font-weight: bold; color: #ffaa44; margin-bottom: 6px;">WEAPON WHEEL</div>
      <div id="weapon-slots" style="display: flex; gap: 10px;"></div>
    </div>
    <div id="hud-speedometer" style="font-size: 14px; font-weight: bold; background: rgba(10, 15, 25, 0.75); padding: 8px 14px; border-radius: 6px;">0 KM/H</div>
  </div>
</div>
<div id="hud-notify"></div>
<div id="title-overlay">
  <h1>CALDERA BAY</h1>
  <p>An Original Open-World Crime Game</p>
  <button id="start-btn">PLAY GAME</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./main.js"></script>
</body>
</html>
